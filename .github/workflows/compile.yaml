---
name: Compile
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: "[]"
        CI_IGNORE_PATHS: '[".circleci/**",".github/workflows/**","!.github/workflows/compile.yaml","**/*.md"]'
      run: python3 .github/scripts/ci_changes.py
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
    - name: Cache .mypy_cache
      uses: actions/cache@v6
      with:
        path: ".mypy_cache"
        key: mypy-cache-${{ runner.os }}-x64-${{ hashFiles('**/*.py', 'pyproject.toml') }}
    - name: Delete existing build files
      run: rm -rf build
    - name: Install Faster Hexbytes
      env:
        MYPYC_STRICT_DUNDER_TYPING: 1
      run: pip install .
    - name: Normalize C files for diffchecking
      run: |
        # Insert DIFFCHECK_PLACEHOLDER macro at the top if not present
        for f in build/*.c; do
          if ! grep -q 'DIFFCHECK_PLACEHOLDER' "$f"; then
            sed -i '1i#ifndef DIFFCHECK_PLACEHOLDER\n#define DIFFCHECK_PLACEHOLDER 0\n#endif' "$f"
          fi
        done
        # Replace line number in CPy_AddTraceback with macro
        sed -i 's/\(CPy_AddTraceback([^,]*, *[^,]*, *\)[0-9]\+\(, *[^)]*)\)/\1DIFFCHECK_PLACEHOLDER\2/g' build/*.c
        # Replace index in CPyStatics[...] with macro
        sed -i 's/CPyStatics\[[0-9]\+\]/CPyStatics[DIFFCHECK_PLACEHOLDER]/g' build/*.c
    - name: Verify generated source is current
      run: git diff --exit-code -- build
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (compile.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - build-ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["build-ubuntu"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  pull_request:
    paths: ["**"]
    branches:
    - master
  push:
    branches:
    - master
    paths-ignore:
    - ".circleci/**"
    - ".github/workflows/**"
    - "!.github/workflows/compile.yaml"
    - "**/*.md"
permissions:
  contents: read
