---
name: Tox
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["**.py",".github/workflows/tox.yaml","pyproject.toml","setup.py","tox.ini"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  test:
    name: Test (${{ matrix.jobtype }}, 3.${{ matrix.pyminor }}, ${{ matrix.os }}, ${{ matrix.architecture }})
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        pyminor:
        - '10'
        - '11'
        - '12'
        - '13'
        - 13t
        - '14'
        - 14t
        jobtype:
        - core
        - lint
        - wheel
        architecture:
        - x64
        - x86
        exclude:
        - os: macos-latest
          architecture: x86
      max-parallel: "${{ (github.event_name == 'schedule' || github.event_name == 'push') && 4 || 1000 }}"
    env:
      TOXENV: py3${{ matrix.pyminor }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: "${{ github.event_name == 'schedule' && '-r' || '' }}"
      IS_UBUNTU_32BIT: "${{ matrix.os == 'ubuntu-latest' && matrix.architecture == 'x86' }}"
    steps:
    - uses: actions/checkout@v7
    - name: Run job in 32-bit Ubuntu Docker container
      if: "${{ env.IS_UBUNTU_32BIT == 'true' }}"
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          -e TOXENV="${{ env.TOXENV }}" \
          -e TOX_RECREATE_FLAG="${{ env.TOX_RECREATE_FLAG }}" \
          -e IS_UBUNTU_32BIT="${{ env.IS_UBUNTU_32BIT }}" \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          i386/python:3.${{ matrix.pyminor }} \
          bash -lc '
            python -m pip install --upgrade pip
            python -m pip install tox
            python -m tox -e "$TOXENV" $TOX_RECREATE_FLAG
          '
      continue-on-error: "${{ matrix.pyminor == '13t' || matrix.pyminor == '14t' }}"
    - name: Set up Python (macos)
      if: "${{ matrix.os == 'macos-latest' }}"
      uses: actions/setup-python@v7
      with:
        python-version: 3.${{ matrix.pyminor }}
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
          tox.ini
    - name: Set up Python
      if: "${{ matrix.os != 'macos-latest' && env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/setup-python@v7
      with:
        python-version: 3.${{ matrix.pyminor }}
        architecture: "${{ matrix.architecture }}"
        cache: pip
        cache-dependency-path: |
          setup.py
          pyproject.toml
          tox.ini
    - name: Upgrade pip and install tox
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Cache .mypy_cache
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/cache@v6
      with:
        path: ".mypy_cache"
        key: mypy-cache-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}
    - name: Restore tox environment and hypothesis examples
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      uses: actions/cache/restore@v6
      id: tox-cache
      with:
        path: |
          .tox
          .hypothesis
        key: "${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-${{ matrix.architecture }}-${{ matrix.jobtype }}"
    - name: Run tox
      if: "${{ env.IS_UBUNTU_32BIT != 'true' }}"
      shell: bash
      run: python -m tox run ${{ env.TOX_RECREATE_FLAG }}
    - name: Save tox environment and hypothesis examples
      if: "${{ env.IS_UBUNTU_32BIT != 'true' && (success() || env.TOX_RECREATE_FLAG == '-r') }}"
      uses: actions/cache/save@v6
      with:
        path: |
          .tox
          .hypothesis
        key: "${{ steps.tox-cache.outputs.cache-primary-key }}"
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (tox.yaml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["test"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  push:
    branches:
    - main
    - master
    paths:
    - "**.py"
    - ".github/workflows/tox.yaml"
    - pyproject.toml
    - setup.py
    - tox.ini
  pull_request:
    paths: ["**"]
    branches:
    - main
    - master
  schedule:
  - cron: 0 10 * * *
  workflow_dispatch:
